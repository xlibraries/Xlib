name: CI

# Checks for pushes and pull requests. Deployment is handled by Vercel.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Dependency graph (architecture/layers.json; no new violations)
        run: pnpm graph
      - name: API docs (Doxygen; fails on broken documentation)
        run: sudo apt-get install -y --no-install-recommends doxygen && mkdir -p build/doxygen && pnpm docs:api
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Unit tests (site and packages)
        run: pnpm test
      - name: Python tests
        run: pnpm --filter @xlibraries/web test:python
      # next build directly: skips the playlist refresh, which needs the network and isn't under test
      - name: Build
        run: pnpm --filter @xlibraries/web exec next build --webpack
      - name: Install browser for e2e tests
        run: pnpm --filter @xlibraries/web exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm --filter @xlibraries/web test:e2e
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7

  # The Arcade's compiled games are committed; rebuild them with the pinned toolchain and fail if they differ
  arcade-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.11
          actions-cache-folder: emsdk-cache
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      # --force: the committed stamps say every module is up to date, so only a forced rebuild proves it reproduces
      - name: Build games (WebGPU + WebGL2)
        run: pnpm --filter @xlibraries/arcade build:native --force
      - name: Committed dist/ matches the sources
        run: git diff --exit-code --stat -- packages/arcade/dist
      - name: Build Bot Lab's native modules (the physics world)
        run: pnpm --filter @xlibraries/bot-lab build:native --force
      - name: Bot Lab's committed dist/ matches the sources
        run: git diff --exit-code --stat -- packages/bot-lab/dist
