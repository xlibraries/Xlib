name: CI

# Checks for pushes and pull requests. Deployment is handled by Vercel.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Unit tests (site and packages)
        run: pnpm test
      - name: Python tests
        run: pnpm --filter @xlibraries/web test:python
      # next build directly: skips the playlist refresh, which needs the network and isn't under test
      - name: Build
        run: pnpm --filter @xlibraries/web exec next build --webpack
      - name: Install browser for e2e tests
        run: pnpm --filter @xlibraries/web exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm --filter @xlibraries/web test:e2e
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7
