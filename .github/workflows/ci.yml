name: CI

# Build check for pushes and pull requests. Deployment is handled by Vercel.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # next build directly: skips the playlist refresh, which needs the network and isn't under test
      - name: Build
        run: pnpm exec next build
