# Deploys Bot Lab's Arduino compile service (services/arduino-compiler) to its Hugging Face Space when it changes on
# master. Set up once with services/arduino-compiler/setup-hf.sh, which creates the Space and stores HF_TOKEN
# (secret) and HF_SPACE (variable) here; until then this workflow skips itself.
name: arduino-compiler

on:
  push:
    branches: [master]
    paths: ['services/arduino-compiler/**', '.github/workflows/arduino-compiler.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency: arduino-compiler-deploy

jobs:
  deploy:
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: cd services/arduino-compiler && python3 -m unittest discover -p 'test_*.py'
      - name: Deploy to the Space and wait until it answers
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: services/arduino-compiler/deploy-hf.sh
