<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Tab</title>
    <style>
        :root {
            --bg1: #1b1438;
            --bg2: #3b1d4a;
            --orange: #fb542b;
            --text: #f5f3ff;
            --muted: #b9b3d6;
        }

        * { box-sizing: border-box; }

        html, body { margin: 0; height: 100%; }

        body {
            background:
                radial-gradient(ellipse at 20% 10%, rgba(251, 84, 43, 0.35), transparent 50%),
                radial-gradient(ellipse at 85% 90%, rgba(162, 89, 255, 0.35), transparent 55%),
                linear-gradient(160deg, var(--bg1), var(--bg2));
            color: var(--text);
            font-family: Ubuntu, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        main { width: 100%; max-width: 620px; text-align: center; }

        .clock { font-size: 56px; font-weight: 300; letter-spacing: 1px; }
        .date { color: var(--muted); margin-bottom: 28px; }

        form {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 999px;
            padding: 6px 6px 6px 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        input {
            flex: 1;
            min-width: 0;
            border: 0;
            outline: none;
            background: transparent;
            font: inherit;
            font-size: 16px;
            color: #1b1438;
            padding: 10px 0;
        }

        button.go {
            border: 0;
            border-radius: 999px;
            background: var(--orange);
            color: #fff;
            font: inherit;
            font-weight: 600;
            padding: 10px 18px;
            cursor: pointer;
        }

        .also { margin-top: 14px; font-size: 13px; color: var(--muted); }
        .also button {
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            border-radius: 999px;
            padding: 5px 12px;
            margin: 4px 3px;
            font: inherit;
            cursor: pointer;
        }
        .also button:hover { background: rgba(255, 255, 255, 0.16); }

        .tiles { display: flex; justify-content: center; gap: 14px; margin-top: 34px; flex-wrap: wrap; }
        .tile {
            width: 86px;
            padding: 12px 6px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            text-decoration: none;
            font-size: 12px;
        }
        .tile:hover { background: rgba(255, 255, 255, 0.16); }
        .tile span { display: block; font-size: 24px; margin-bottom: 6px; }
        .note { margin-top: 26px; font-size: 11px; color: var(--muted); opacity: 0.8; }
    </style>
</head>
<body>
    <main>
        <div class="clock" id="clock"></div>
        <div class="date" id="date"></div>

        <form id="search" autocomplete="off">
            <input id="q" type="text" placeholder="Search the web or type a URL" autofocus>
            <button class="go" type="submit">Search</button>
        </form>

        <div class="also">
            Or search in a new tab:
            <button type="button" data-engine="brave">Brave Search ↗</button>
            <button type="button" data-engine="ddg">DuckDuckGo ↗</button>
            <button type="button" data-engine="google">Google ↗</button>
        </div>

        <div class="tiles">
            <a class="tile" href="https://github.com/xlibraries" target="_blank" rel="noopener"><span>🐙</span>GitHub</a>
            <a class="tile" href="https://www.linkedin.com/in/xlib" target="_blank" rel="noopener"><span>💼</span>LinkedIn</a>
            <a class="tile" href="https://www.youtube.com/@xlibraries" target="_blank" rel="noopener"><span>▶️</span>YouTube</a>
            <a class="tile" href="https://en.wikipedia.org/wiki/Main_Page"><span>📚</span>Wikipedia</a>
        </div>

        <p class="note">Results in this window come from Bing. Brave Search, DuckDuckGo and Google don't allow being shown inside another website, so they open in a new tab.</p>
    </main>

    <script>
    (function () {
        "use strict";

        // In-window results: Bing's results page is one of the few that allows being framed
        const IN_WINDOW = (q) => "https://www.bing.com/search?q=" + encodeURIComponent(q);
        const NEW_TAB = {
            brave: (q) => "https://search.brave.com/search?q=" + encodeURIComponent(q),
            ddg: (q) => "https://duckduckgo.com/?q=" + encodeURIComponent(q),
            google: (q) => "https://www.google.com/search?q=" + encodeURIComponent(q),
        };

        const looksLikeUrl = (text) => /^(https?:\/\/)?(localhost|[\w-]+(\.[\w-]+)+)(:\d+)?(\/\S*)?$/i.test(text);

        const input = document.getElementById("q");

        document.getElementById("search").addEventListener("submit", (e) => {
            e.preventDefault();
            const q = input.value.trim();
            if (!q) return;
            location.href = looksLikeUrl(q) ? (/^https?:\/\//i.test(q) ? q : "https://" + q) : IN_WINDOW(q);
        });

        document.querySelectorAll("[data-engine]").forEach((button) => {
            button.addEventListener("click", () => {
                const q = input.value.trim();
                const engine = NEW_TAB[button.dataset.engine];
                window.open(q ? engine(q) : engine("").replace(/[?&]q=$|\?$/, "").replace(/\/search$/, "/"), "_blank", "noopener");
            });
        });

        function tick() {
            const now = new Date();
            document.getElementById("clock").textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
            document.getElementById("date").textContent = now.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });
        }
        tick();
        setInterval(tick, 10000);
    })();
    </script>
</body>
</html>
